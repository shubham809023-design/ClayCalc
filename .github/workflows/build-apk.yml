name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Sync Web Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html styles.css script.js engine.js android/app/src/main/assets/

      - name: Build APK with Gradle
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare APK Files
        run: |
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" ClayCalc.apk
          cp "$APK_FILE" ClayCalc-v1.0.0.apk
          ls -lh ClayCalc.apk ClayCalc-v1.0.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClayCalc-v1.0.0-APK
          path: ClayCalc-v1.0.0.apk

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 ClayCalc.apk ClayCalc-v1.0.0.apk --clobber
